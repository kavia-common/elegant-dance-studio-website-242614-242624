spring.application.name=nextjsbackendadmin

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework

# Multipart upload limits (gallery images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# =========================
# Supabase configuration (ENV-BASED)
# =========================
# IMPORTANT: These must be provided via environment variables (.env managed by orchestrator).
supabase.url=${SUPABASE_URL:}
supabase.anonKey=${SUPABASE_ANON_KEY:}
supabase.serviceRoleKey=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:gallery}
supabase.db.galleryTable=${SUPABASE_GALLERY_TABLE:gallery_images}

# Admin protection
# If set, all /api/admin/** endpoints require "Authorization: Bearer <token>" where token is validated.
admin.jwt.secret=${ADMIN_JWT_SECRET:}
admin.jwt.issuer=${ADMIN_JWT_ISSUER:}
